name: Free Distribution Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 2.0.0)"
        required: true
        type: string
      create_homebrew_update:
        description: "Update the Homebrew cask in rohitctrl/homebrew-tap"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: free-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up environment variables
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
          xcodebuild -version
          cmake --version | head -1

      # The app only needs the macOS slice. The upstream script also builds iOS,
      # visionOS and tvOS, which is slow and needs SDKs the runner may not have.
      - name: Cache Whisper XCFramework
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: whisper.cpp/build-apple
          key: whisper-xcframework-macos-${{ runner.os }}-${{ hashFiles('whisper.cpp/src/**', 'whisper.cpp/ggml/**', 'whisper.cpp/include/**', 'whisper.cpp/CMakeLists.txt', 'whisper.cpp/build-xcframework.sh') }}

      - name: Build Whisper XCFramework (macOS only)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          cd whisper.cpp
          # Reuse the upstream config, helper functions and tool checks (everything
          # before the first platform build), then append a macOS-only build.
          awk '/^echo "Building for iOS simulator/{exit} {print}' build-xcframework.sh > build-xcframework-macos.sh
          cat >> build-xcframework-macos.sh <<'MACOS'
          echo "Building for macOS..."
          cmake -B build-macos -G Xcode \
              "${COMMON_CMAKE_ARGS[@]}" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=${MACOS_MIN_OS_VERSION} \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
              -DCMAKE_C_FLAGS="${COMMON_C_FLAGS}" \
              -DCMAKE_CXX_FLAGS="${COMMON_CXX_FLAGS}" \
              -DWHISPER_COREML="ON" \
              -DWHISPER_COREML_ALLOW_FALLBACK="ON" \
              -S .
          cmake --build build-macos --config Release -- -quiet

          setup_framework_structure "build-macos" ${MACOS_MIN_OS_VERSION} "macos"
          combine_static_libraries "build-macos" "Release" "macos" "false"

          xcodebuild -create-xcframework \
              -framework $(pwd)/build-macos/framework/whisper.framework \
              -output $(pwd)/build-apple/whisper.xcframework
          MACOS
          bash build-xcframework-macos.sh
          rm build-xcframework-macos.sh

      - name: Verify Whisper XCFramework
        run: |
          ls -la whisper.cpp/build-apple/
          test -d whisper.cpp/build-apple/whisper.xcframework

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ hashFiles('mindmic.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # Built with signing off; the app is ad-hoc signed in the next step.
      # Apple Silicon only: FluidAudio and the Core ML path are not verified on Intel.
      - name: Build archive
        run: |
          set -o pipefail
          rm -rf build-unsigned && mkdir -p build-unsigned
          xcodebuild archive \
            -project mindmic.xcodeproj \
            -scheme mindmic \
            -configuration Release \
            -archivePath build-unsigned/mindmic.xcarchive \
            -destination "generic/platform=macOS" \
            -clonedSourcePackagesDirPath .spm \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            > build-unsigned/archive.log 2>&1 || {
              echo "---- compile errors ----"
              grep -E "error:|fatal error|Undefined symbols|ld: " build-unsigned/archive.log | grep -v "Swift 6 language mode" | sort -u | head -40
              echo "---- last 30 lines ----"
              tail -30 build-unsigned/archive.log
              exit 1
            }
          tail -5 build-unsigned/archive.log

      - name: Extract app and ad-hoc sign
        run: |
          APP_SRC=$(find build-unsigned/mindmic.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP_SRC" || { echo "No .app in archive"; exit 1; }
          ditto "$APP_SRC" build-unsigned/MindMic.app

          # keychain-access-groups is a restricted entitlement: with an ad-hoc
          # signature macOS kills the app at launch. The mach-lookup exception is
          # a sandbox-only leftover with unexpanded $(...) variables.
          cp mindmic/mindmic.entitlements build-unsigned/adhoc.entitlements
          /usr/libexec/PlistBuddy -c "Delete :keychain-access-groups" build-unsigned/adhoc.entitlements || true
          /usr/libexec/PlistBuddy -c "Delete :com.apple.security.temporary-exception.mach-lookup.global-name" build-unsigned/adhoc.entitlements || true

          for fw in build-unsigned/MindMic.app/Contents/Frameworks/*.framework; do
            echo "== $fw"; ls -la "$fw"
          done

          codesign --force --deep --sign - \
            --entitlements build-unsigned/adhoc.entitlements \
            build-unsigned/MindMic.app

          codesign --verify --deep --strict --verbose=2 build-unsigned/MindMic.app
          codesign -dv build-unsigned/MindMic.app 2>&1 | grep -E "Signature|Identifier"
          lipo -archs "build-unsigned/MindMic.app/Contents/MacOS/$(defaults read "$PWD/build-unsigned/MindMic.app/Contents/Info" CFBundleExecutable)"

      - name: Create ZIP archive
        run: |
          # ditto keeps framework symlinks intact; plain zip can corrupt the bundle.
          cd build-unsigned
          ditto -c -k --sequesterRsrc --keepParent MindMic.app "MindMic-$VERSION-unsigned.zip"

      - name: Create DMG
        run: |
          mkdir -p build-unsigned/dmg_temp
          ditto build-unsigned/MindMic.app build-unsigned/dmg_temp/MindMic.app
          ln -s /Applications build-unsigned/dmg_temp/Applications

          cat > build-unsigned/dmg_temp/INSTALL-README.txt <<'TXT'
          MindMic is not notarized by Apple (no paid developer account), so macOS
          blocks it the first time you open it. This is expected.

          1. Drag MindMic.app into Applications.
          2. Open MindMic once. macOS will say it cannot verify the app. Click Done.
          3. Open System Settings > Privacy & Security, scroll down, and click
             "Open Anyway" next to the MindMic message. Confirm with your password.
          4. If macOS says the app is "damaged", run this in Terminal, then reopen:
               xattr -dr com.apple.quarantine /Applications/MindMic.app
          5. Grant microphone and screen recording permissions when asked.

          Requires macOS 14 or later on an Apple Silicon Mac (M1 or newer).
          Help: https://github.com/rohitctrl/mindmic.app
          TXT

          hdiutil create \
            -srcfolder build-unsigned/dmg_temp \
            -volname "MindMic" \
            -fs HFS+ \
            -format UDBZ \
            "build-unsigned/MindMic-$VERSION-unsigned.dmg"

          echo "DMG_SIZE=$(stat -f%z "build-unsigned/MindMic-$VERSION-unsigned.dmg")" >> $GITHUB_ENV

      - name: Generate checksums and release info
        run: |
          cd build-unsigned
          DMG_SHA256=$(shasum -a 256 "MindMic-$VERSION-unsigned.dmg" | awk '{print $1}')
          ZIP_SHA256=$(shasum -a 256 "MindMic-$VERSION-unsigned.zip" | awk '{print $1}')
          echo "DMG_SHA256=$DMG_SHA256" >> $GITHUB_ENV
          echo "ZIP_SHA256=$ZIP_SHA256" >> $GITHUB_ENV

          echo "$DMG_SHA256  MindMic-$VERSION-unsigned.dmg" > checksums.txt
          echo "$ZIP_SHA256  MindMic-$VERSION-unsigned.zip" >> checksums.txt

          cat > release-info.json <<JSON
          {
            "version": "$VERSION",
            "build": "$BUILD_NUMBER",
            "dmg_name": "MindMic-$VERSION-unsigned.dmg",
            "zip_name": "MindMic-$VERSION-unsigned.zip",
            "dmg_size": "$DMG_SIZE",
            "dmg_sha256": "$DMG_SHA256",
            "zip_sha256": "$ZIP_SHA256",
            "release_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "min_system_version": "14.0",
            "unsigned": true
          }
          JSON
          cat release-info.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-build-artifacts
          path: |
            build-unsigned/*.dmg
            build-unsigned/*.zip
            build-unsigned/checksums.txt
            build-unsigned/release-info.json
            build-unsigned/archive.log
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: MindMic ${{ env.VERSION }}
          body: |
            ## MindMic ${{ env.VERSION }}

            ### First launch (required, one time)

            MindMic is not notarized by Apple because I don't pay for a developer account, so macOS blocks it on first open. The code is open source.

            1. Download the DMG (or ZIP) below and move **MindMic.app** to Applications.
            2. Open MindMic once. macOS says it can't verify the app. Click **Done**.
            3. Open **System Settings → Privacy & Security**, scroll down, and click **Open Anyway** next to the MindMic message.
            4. If macOS says the app is **"damaged"**, run this in Terminal and reopen it:
               ```bash
               xattr -dr com.apple.quarantine /Applications/MindMic.app
               ```
            5. Grant microphone and screen recording permissions when asked.

            ### Homebrew
            ```bash
            brew tap rohitctrl/homebrew-tap
            brew install --cask mindmic
            ```

            ### Verify your download
            - DMG SHA256: `${{ env.DMG_SHA256 }}`
            - ZIP SHA256: `${{ env.ZIP_SHA256 }}`
            ```bash
            shasum -a 256 ~/Downloads/MindMic-${{ env.VERSION }}-unsigned.dmg
            ```

            ### Requirements
            - macOS 14.0 or later
            - Apple Silicon Mac (M1 or newer). Intel Macs are not supported by this build.

            More help: [Installation guide](https://github.com/rohitctrl/mindmic.app/blob/main/INSTALLATION.md) · [Unsigned app FAQ](https://github.com/rohitctrl/mindmic.app/blob/main/UNSIGNED-APP-FAQ.md)
          files: |
            build-unsigned/MindMic-${{ env.VERSION }}-unsigned.dmg
            build-unsigned/MindMic-${{ env.VERSION }}-unsigned.zip
            build-unsigned/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    needs: build-unsigned
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_homebrew_update == 'true'

    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: rohitctrl/homebrew-tap
          # A token with write access to the tap repo; GITHUB_TOKEN cannot push there.
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Download release info
        uses: actions/download-artifact@v4
        with:
          name: unsigned-build-artifacts
          path: artifacts

      - name: Update cask formula
        run: |
          VERSION=$(jq -r '.version' artifacts/release-info.json)
          DMG_SHA256=$(jq -r '.dmg_sha256' artifacts/release-info.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          sed -i '' -E "s/version \"[^\"]*\"/version \"$VERSION\"/" Casks/mindmic.rb
          sed -i '' -E "s/sha256 (:no_check|\"[^\"]*\")/sha256 \"$DMG_SHA256\"/" Casks/mindmic.rb
          cat Casks/mindmic.rb

      - name: Commit and push changes
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add Casks/mindmic.rb
          git commit -m "Update mindmic to $VERSION"
          git push
