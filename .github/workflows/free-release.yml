name: Free Distribution Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 2.0.0)"
        required: true
        type: string
      publish:
        description: "Publish the verified release and update Homebrew"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: free-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-unsigned:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up environment variables
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$REQUESTED_VERSION"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version"; exit 1; }
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$(date +%s)" >> $GITHUB_ENV
          xcodebuild -version
          cmake --version | head -1

      # The app only needs the macOS slice. The upstream script also builds iOS,
      # visionOS and tvOS, which is slow and needs SDKs the runner may not have.
      - name: Cache Whisper XCFramework
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: whisper.cpp/build-apple
          key: whisper-xcframework-macos-${{ runner.os }}-${{ hashFiles('whisper.cpp/src/**', 'whisper.cpp/ggml/**', 'whisper.cpp/include/**', 'whisper.cpp/CMakeLists.txt', 'whisper.cpp/build-xcframework.sh') }}

      - name: Build Whisper XCFramework (macOS only)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          cd whisper.cpp
          # Reuse the upstream config, helper functions and tool checks (everything
          # before the first platform build), then append a macOS-only build.
          awk '/^echo "Building for iOS simulator/{exit} {print}' build-xcframework.sh > build-xcframework-macos.sh
          cat >> build-xcframework-macos.sh <<'MACOS'
          echo "Building for macOS..."
          cmake -B build-macos -G Xcode \
              "${COMMON_CMAKE_ARGS[@]}" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=${MACOS_MIN_OS_VERSION} \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
              -DCMAKE_C_FLAGS="${COMMON_C_FLAGS}" \
              -DCMAKE_CXX_FLAGS="${COMMON_CXX_FLAGS}" \
              -DWHISPER_COREML="ON" \
              -DWHISPER_COREML_ALLOW_FALLBACK="ON" \
              -S .
          cmake --build build-macos --config Release -- -quiet

          setup_framework_structure "build-macos" ${MACOS_MIN_OS_VERSION} "macos"
          combine_static_libraries "build-macos" "Release" "macos" "false"

          xcodebuild -create-xcframework \
              -framework $(pwd)/build-macos/framework/whisper.framework \
              -output $(pwd)/build-apple/whisper.xcframework
          MACOS
          bash build-xcframework-macos.sh
          rm build-xcframework-macos.sh

      - name: Verify Whisper XCFramework
        run: |
          ls -la whisper.cpp/build-apple/
          test -d whisper.cpp/build-apple/whisper.xcframework

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ hashFiles('mindmic.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # Built with signing off; the app is ad-hoc signed in the next step.
      # Apple Silicon only: FluidAudio and the Core ML path are not verified on Intel.
      - name: Build archive
        run: |
          set -o pipefail
          rm -rf build-unsigned && mkdir -p build-unsigned
          xcodebuild archive \
            -project mindmic.xcodeproj \
            -scheme mindmic \
            -configuration Release \
            -archivePath build-unsigned/mindmic.xcarchive \
            -destination "generic/platform=macOS" \
            -clonedSourcePackagesDirPath .spm \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            > build-unsigned/archive.log 2>&1 || {
              echo "---- compile errors ----"
              grep -E "error:|fatal error|Undefined symbols|ld: " build-unsigned/archive.log | grep -v "Swift 6 language mode" | sort -u | head -40
              echo "---- last 30 lines ----"
              tail -30 build-unsigned/archive.log
              exit 1
            }
          tail -5 build-unsigned/archive.log

      - name: Extract app and ad-hoc sign
        run: |
          APP_SRC=$(find build-unsigned/mindmic.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP_SRC" || { echo "No .app in archive"; exit 1; }
          ditto "$APP_SRC" build-unsigned/MindMic.app

          python3 .github/scripts/sign-adhoc.py build-unsigned/MindMic.app mindmic/mindmic.entitlements
          python3 .github/scripts/verify-release.py build-unsigned/MindMic.app

      - name: Create ZIP archive
        run: |
          # ditto keeps framework symlinks intact; plain zip can corrupt the bundle.
          cd build-unsigned
          ditto -c -k --sequesterRsrc --keepParent MindMic.app "MindMic-$VERSION-unsigned.zip"

      - name: Create DMG
        run: |
          mkdir -p build-unsigned/dmg_temp
          ditto build-unsigned/MindMic.app build-unsigned/dmg_temp/MindMic.app
          ln -s /Applications build-unsigned/dmg_temp/Applications

          cat > build-unsigned/dmg_temp/INSTALL-README.txt <<'TXT'
          MindMic is not notarized by Apple (no paid developer account), so macOS
          blocks it the first time you open it. This is expected.

          1. Drag MindMic.app into Applications.
          2. Open MindMic once. macOS will say it cannot verify the app. Click Done.
          3. Open System Settings > Privacy & Security, scroll down, and click
             "Open Anyway" next to the MindMic message. Confirm with your password.
          4. Grant microphone and screen recording permissions when asked.

          "Contains malware", automatic removal, or "damaged" are not the expected
          approval prompt. Report those messages at the help URL below.

          Requires macOS 14 or later on an Apple Silicon Mac (M1 or newer).
          Help: https://github.com/rohitctrl/mindmic.app
          TXT

          hdiutil create \
            -srcfolder build-unsigned/dmg_temp \
            -volname "MindMic" \
            -fs HFS+ \
            -format UDBZ \
            "build-unsigned/MindMic-$VERSION-unsigned.dmg"

          echo "DMG_SIZE=$(stat -f%z "build-unsigned/MindMic-$VERSION-unsigned.dmg")" >> $GITHUB_ENV

      - name: Generate checksums and release info
        run: |
          cd build-unsigned
          DMG_SHA256=$(shasum -a 256 "MindMic-$VERSION-unsigned.dmg" | awk '{print $1}')
          ZIP_SHA256=$(shasum -a 256 "MindMic-$VERSION-unsigned.zip" | awk '{print $1}')
          echo "DMG_SHA256=$DMG_SHA256" >> $GITHUB_ENV
          echo "ZIP_SHA256=$ZIP_SHA256" >> $GITHUB_ENV

          echo "$DMG_SHA256  MindMic-$VERSION-unsigned.dmg" > checksums.txt
          echo "$ZIP_SHA256  MindMic-$VERSION-unsigned.zip" >> checksums.txt

          cat > release-info.json <<JSON
          {
            "version": "$VERSION",
            "build": "$BUILD_NUMBER",
            "dmg_name": "MindMic-$VERSION-unsigned.dmg",
            "zip_name": "MindMic-$VERSION-unsigned.zip",
            "dmg_size": "$DMG_SIZE",
            "dmg_sha256": "$DMG_SHA256",
            "zip_sha256": "$ZIP_SHA256",
            "release_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "min_system_version": "14.0",
            "unsigned": true
          }
          JSON
          cat release-info.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-build-artifacts
          path: |
            build-unsigned/*.dmg
            build-unsigned/*.zip
            build-unsigned/checksums.txt
            build-unsigned/release-info.json
            build-unsigned/archive.log
          retention-days: 30

  verify-install:
    needs: build-unsigned
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-build-artifacts
          path: artifacts
      - name: Install the packaged DMG through Homebrew
        run: |
          test "$(uname -m)" = arm64
          brew tap-new local/mindmic-ci
          python3 .github/scripts/render-cask.py artifacts/release-info.json \
            "$(brew --repository local/mindmic-ci)/Casks/mindmic.rb" \
            "file://$PWD/artifacts/$(jq -r .dmg_name artifacts/release-info.json)"
          brew install --cask local/mindmic-ci/mindmic
          python3 .github/scripts/verify-release.py /Applications/MindMic.app
      - name: Record Gatekeeper assessment before approval
        run: |
          # An ad-hoc release is expected to require approval. Keep the assessment
          # as evidence separately from signature integrity and runtime startup.
          set +e
          spctl --assess --type execute --verbose=4 /Applications/MindMic.app > artifacts/gatekeeper.log 2>&1
          echo "Assessment exit status: $?" >> artifacts/gatekeeper.log
          cat artifacts/gatekeeper.log
      - name: Check launch after first-open approval
        run: |
          # Headless CI cannot click Open Anyway. Removing quarantine here models
          # that user approval for the runtime test; the shipped cask never does it.
          xattr -dr com.apple.quarantine /Applications/MindMic.app || true
          /Applications/MindMic.app/Contents/MacOS/mindmic > artifacts/launch.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in {1..15}; do
            sleep 1
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat artifacts/launch.log
              /usr/bin/log show --last 2m --style compact --predicate 'eventMessage CONTAINS[c] "mindmic"'
              exit 1
            fi
          done
          echo "MindMic remained running for 15 seconds on $(sw_vers -productVersion)."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-${{ matrix.os }}
          path: |
            artifacts/launch.log
            artifacts/gatekeeper.log

  publish:
    needs: [build-unsigned, verify-install]
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-build-artifacts
          path: artifacts
      - name: Check Homebrew credentials before publishing
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$TAP_TOKEN"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version artifacts/release-info.json)
          cat > artifacts/notes.md <<'NOTES'
          Fixes launch failures caused by expired development provisioning profiles.
          Free, ad-hoc signed release for Apple Silicon Macs running macOS 14 or later.
          Packaged installation and launch are checked on macOS 15 and 26.

          Install: `brew install --cask rohitctrl/tap/mindmic`
          Upgrade: `brew update && brew upgrade --cask mindmic`

          First launch: open MindMic, then use System Settings > Privacy & Security > Open Anyway.
          This build is not Apple-notarized. A "contains malware" or "damaged" alert is not
          the expected approval prompt; report it instead of bypassing it.
          NOTES
          gh release create "v$VERSION" artifacts/*.dmg artifacts/*.zip artifacts/checksums.txt \
            --target "$GITHUB_SHA" --title "MindMic $VERSION" --notes-file artifacts/notes.md --latest
      - uses: actions/checkout@v4
        with:
          repository: rohitctrl/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update Homebrew to the exact published artifact
        run: |
          VERSION=$(jq -r .version artifacts/release-info.json)
          python3 .github/scripts/render-cask.py artifacts/release-info.json tap/Casks/mindmic.rb
          ruby -c tap/Casks/mindmic.rb
          cat > tap/README.md <<'README'
          # MindMic Homebrew tap

          Free voice transcription for Apple Silicon Macs (M1 or newer), macOS 14 or later.

          ```bash
          brew install --cask rohitctrl/tap/mindmic
          ```

          On first launch, open MindMic, then go to **System Settings > Privacy & Security > Open Anyway**.
          MindMic is ad-hoc signed and not notarized by Apple. Grant microphone access when prompted.
          A "contains malware" or "damaged" alert is not the expected approval prompt; report it.

          To upgrade, run `brew update` then `brew upgrade --cask rohitctrl/tap/mindmic`.
          If macOS moved an old copy to the Bin, use `brew reinstall --cask rohitctrl/tap/mindmic`.

          [Installation guide](https://github.com/rohitctrl/mindmic.app/blob/main/INSTALLATION.md)
          · [Report an app problem](https://github.com/rohitctrl/mindmic.app/issues)
          · [Report a cask problem](https://github.com/rohitctrl/homebrew-tap/issues)
          README
          git -C tap config user.email "action@github.com"
          git -C tap config user.name "GitHub Action"
          git -C tap add Casks/mindmic.rb README.md
          git -C tap commit -m "Update MindMic to $VERSION with verified free signing"
          git -C tap push
      - name: Verify published cask download and signature
        run: |
          brew install --cask rohitctrl/tap/mindmic
          python3 .github/scripts/verify-release.py /Applications/MindMic.app
